name: Check and deploy

# On every push to main: run the automated checks on the committed site.
# Deploy to Azure Static Web Apps only when the deployment token exists as a
# repository secret (AZURE_STATIC_WEB_APPS_API_TOKEN). Until then the deploy
# step is skipped and the run stays green.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Automated checks on the committed site
        run: python build/check.py

  deploy:
    needs: check
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - id: token
        name: Is a deployment target configured?
        run: |
          if [ -n "$SWA_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No AZURE_STATIC_WEB_APPS_API_TOKEN secret yet; nothing is deployed."
          fi
      - name: Deploy site/ to Azure Static Web Apps
        if: steps.token.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          output_location: ""
